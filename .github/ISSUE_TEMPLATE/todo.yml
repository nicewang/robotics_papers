name: "ToDo"
description: "Create a structured ToDo issue"
title: "ToDo-YYYY/MM/DD"
labels: ["todo"]
body:
  - type: textarea
    id: tasks_and_summaries
    attributes:
      label: "Tasks"
      description: "List your tasks here. Supports Markdown, Tables, and LaTeX."
      value: |
        ### ✅ ToDo List
        - [ ] Literature Review: 
        - [ ] Implementation & Experiment: 
        - [ ] e.g. **Summary & Comparison**:

        ---

        ### 📝 Theoretical Insight: Control vs. RL
        > Traditional **Nonlinear Control** (e.g., **Lyapunov**) pursues **Certifiability**, whereas **RL** relies on **Heuristic Search**.

        | Feature | Nonlinear Control (e.g., CLF/CBF) | Reinforcement Learning (RL) |
        | :--- | :--- | :--- |
        | **Theoretical Foundation** | Rigorous differential geometry | Statistical learning & MDP |
        | **Guarantees** | Analytical proofs for Stability/Safety | Probabilistic bounds; edge-case sensitive |
        | **Model Dependency** | High. Requires exact model $f(x, u)$ | Low (Model-free). Handles unknown envs |
        | **Approach** | **Design**: Derived from physical laws | **Search**: Trial-and-error reward maximization |

        ---

        - [ ] etc.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: "Additional Notes"
      placeholder: "Log any unexpected results or future ideas..."