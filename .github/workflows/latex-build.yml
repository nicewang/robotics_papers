name: Build LaTeX PDF

on:
  push:
    # branches: [no_exist]
    branches: [ "conf_icra_25_boxmap" ]
  pull_request:
    branches: [ "conf_icra_25_boxmap" ]

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          # root_file: conf/icra/25/boxmap/main.tex
          working_directory: conf/icra/25/boxmap/

      # - name: Upload PDF artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: paper-summary-pdf
      #     path: main.pdf
      
      - name: Rename PDF
        run: |
          old_path="conf/icra/25/boxmap/main.pdf"
          new_name="BoxMap_summarization.pdf"
          mv "$old_path" "$new_name"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoxMap_summarization_pdf
          path: BoxMap_summarization.pdf


