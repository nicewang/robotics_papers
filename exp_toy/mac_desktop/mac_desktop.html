<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>macOS 28 Hyperion - Ultimate</title>
    <style>
        /* --- CORE VARIABLES --- */
        :root {

            /* 换用 jsDelivr CDN，确保国内网络能瞬间加载官方原版壁纸 */
            --bg-image: url('https://cdn.jsdelivr.net/gh/komeil/macOS-wallpapers@master/macOS%2010.15%20Catalina/Catalina%20Day.jpg');
            
            --glass-menu: rgba(255, 255, 255, 0.3);
            --glass-win: rgba(245, 245, 245, 0.65);
            --glass-dock: rgba(255, 255, 255, 0.25);
            --border-light: rgba(255, 255, 255, 0.4);
            
            --text-main: #000;
            --accent-color: #007AFF;
            --font-sys: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            
            --shadow-win: 0 20px 50px rgba(0,0,0,0.25);
        }

        /* Dark Mode Override */
        body.dark-mode {

            /* 夜间版 Catalina 壁纸同样启用 CDN */
            --bg-image: url('https://cdn.jsdelivr.net/gh/komeil/macOS-wallpapers@master/macOS%2010.15%20Catalina/Catalina%20Night.jpg');
            --glass-menu: rgba(0, 0, 0, 0.3);
            --glass-win: rgba(30, 30, 30, 0.65);
            --glass-dock: rgba(0, 0, 0, 0.4);
            --border-light: rgba(255, 255, 255, 0.1);
            --text-main: #fff;
            --shadow-win: 0 20px 50px rgba(0,0,0,0.6);
        }

        * { box-sizing: border-box; user-select: none; outline: none; -webkit-user-drag: none; cursor: default; }
        body { margin: 0; overflow: hidden; font-family: var(--font-sys); background: #000; color: var(--text-main); }

        /* --- BOOT SCREEN (The "Nebula" Feature) --- */
        #boot-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 999999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1s ease-in-out;
        }
        .boot-logo { font-size: 80px; color: white; margin-bottom: 40px; }
        .boot-bar-bg { width: 220px; height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
        .boot-bar-fill { height: 100%; width: 0%; background: white; border-radius: 3px; transition: width 0.5s ease-out; }

        /* --- DESKTOP --- */
        #desktop {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: var(--bg-image); 
            background-size: cover; 
            background-position: center;
            transition: background-image 0.8s ease-in-out, transform 0.3s, filter 0.3s;
        }

        /* Selection Box */
        #selection-box {
            position: absolute; background: rgba(0, 122, 255, 0.2);
            border: 1px solid rgba(0, 122, 255, 0.5); border-radius: 3px; display: none; z-index: 10;
        }

        /* --- MENU BAR --- */
        #menubar {
            position: absolute; top: 0; width: 100%; height: 30px;
            background: var(--glass-menu); backdrop-filter: blur(25px);
            display: flex; justify-content: space-between; align-items: center; padding: 0 18px;
            font-size: 13px; font-weight: 500; z-index: 10000; color: white;
            box-shadow: 0 1px 5px rgba(0,0,0,0.05); transition: background 0.3s;
        }
        .menu-grp { display: flex; gap: 18px; }
        .menu-item:hover { opacity: 0.7; }

        /* --- DESKTOP ICONS --- */
        #icon-grid {
            position: absolute; top: 40px; right: 20px; bottom: 100px; width: auto;
            display: flex; flex-direction: column; flex-wrap: wrap-reverse; align-content: flex-end; gap: 15px;
            pointer-events: none; /* Allows clicks to pass through to desktop for selection */
        }
        .d-icon {
            width: 80px; height: 95px; pointer-events: auto;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            border-radius: 5px; border: 1px solid transparent; padding: 5px;
            transition: background 0.1s;
        }
        .d-icon:hover { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); }
        .d-icon.selected { background: rgba(0, 100, 255, 0.3); border: 1px solid rgba(0, 122, 255, 0.5); }
        .d-img { font-size: 46px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)); margin-bottom: 4px; }
        .d-label { 
            color: white; font-size: 12px; text-align: center; font-weight: 500;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8); line-height: 1.25;
            padding: 1px 4px; border-radius: 3px; 
            max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .d-icon.selected .d-label { background: #0058d0; text-shadow: none; }

        /* --- WINDOWS (Enhanced) --- */
        .window {
            position: absolute;
            background: var(--glass-win);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            box-shadow: var(--shadow-win);
            display: flex; flex-direction: column;
            min-width: 200px; min-height: 150px;
            opacity: 0; transform: scale(0.95);
            transition: opacity 0.25s, transform 0.25s cubic-bezier(0.19, 1, 0.22, 1);
            overflow: hidden;
        }
        .window.open { opacity: 1; transform: scale(1); }
        .window.active { border-color: rgba(255,255,255,0.5); box-shadow: 0 30px 70px rgba(0,0,0,0.4); }

        .title-bar {
            height: 38px; display: flex; align-items: center; padding: 0 14px;
            cursor: default; background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .t-lights { display: flex; gap: 8px; margin-right: 10px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; position: relative; }
        .dot.cl { background: #FF5F57; } .dot.mn { background: #FEBC2E; } .dot.mx { background: #28C840; }
        .dot:hover { filter: brightness(0.9); }
        .t-title { flex: 1; text-align: center; font-size: 13px; font-weight: 600; opacity: 0.7; pointer-events: none; }
        
        .win-body { flex: 1; overflow: auto; position: relative; }
        
        .resize-handle {
            position: absolute; bottom: 0; right: 0; width: 20px; height: 20px; cursor: nwse-resize; z-index: 20;
        }

        /* --- DOCK (Floating Glass) --- */
        #dock-wrap {
            position: absolute; bottom: 15px; width: 100%; display: flex; justify-content: center; z-index: 99999;
        }
        #dock {
            background: var(--glass-dock); backdrop-filter: blur(25px);
            border: 1px solid var(--border-light);
            padding: 8px; border-radius: 24px;
            display: flex; gap: 12px; align-items: flex-end; height: 74px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            transition: width 0.3s ease;
        }
        .dock-app {
            width: 54px; height: 54px; border-radius: 14px; background: #444;
            cursor: pointer; transition: 0.2s cubic-bezier(0.3, 0.7, 0.4, 1.5);
            display: flex; align-items: center; justify-content: center; font-size: 30px;
            position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .dock-app:hover { transform: scale(1.15) translateY(-15px); margin: 0 8px; }
        .dock-app:active { filter: brightness(0.7); transform: scale(0.95); }
        
        .dock-dot {
            width: 4px; height: 4px; background: white; border-radius: 50%;
            position: absolute; bottom: -8px; opacity: 0; transition: opacity 0.3s;
        }
        .dock-app.running .dock-dot { opacity: 0.7; }

        /* --- CONTEXT MENU --- */
        #ctx-menu {
            position: absolute; width: 200px;
            background: var(--glass-win); backdrop-filter: blur(20px);
            border: 1px solid var(--border-light); border-radius: 8px;
            padding: 5px; display: none; flex-direction: column; z-index: 999999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .ctx-item { padding: 6px 10px; border-radius: 4px; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; }
        .ctx-item:hover { background: var(--accent-color); color: white; }
        .ctx-sep { height: 1px; background: rgba(128,128,128,0.2); margin: 4px 0; }

        /* --- APP CONTENTS --- */
        .term-wrap { background: #1e1e1e; height: 100%; color: #33ff00; font-family: 'Menlo', monospace; padding: 12px; font-size: 12px; }
        .term-line { margin-bottom: 4px; }
        .term-input { background: transparent; border: none; color: white; width: 100%; font-family: inherit; font-size: inherit; caret-color: #33ff00; }
        
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; height: 100%; background: #323232; padding: 1px; }
        .calc-display { grid-column: span 4; background: #202020; color: white; font-size: 42px; text-align: right; padding: 15px; font-weight: 300; }
        .calc-btn { border: none; font-size: 20px; cursor: pointer; transition: 0.1s; }
        .c-g { background: #505050; color: white; } .c-o { background: #ff9f0a; color: white; } .c-d { background: #3a3a3a; color: white; }
        .c-g:active, .c-d:active { filter: brightness(1.2); } .c-o:active { filter: brightness(0.8); }

    </style>
</head>
<body class="dark-mode">

    <div id="boot-screen">
        <div class="boot-logo"></div>
        <div class="boot-bar-bg"><div class="boot-bar-fill" id="boot-fill"></div></div>
    </div>

    <div id="desktop">
        <div id="selection-box"></div>
        
        <div id="icon-grid">
            </div>

        <div id="ctx-menu">
            <div class="ctx-item" onclick="Sys.createFolder()">New Folder</div>
            <div class="ctx-item">Get Info</div>
            <div class="ctx-sep"></div>
            <div class="ctx-item" onclick="Sys.toggleTheme()">Toggle Dark/Light Mode</div>
            <div class="ctx-item" onclick="Sys.changeWallpaper()">Next Wallpaper 🌅</div>
            <div class="ctx-sep"></div>
            <div class="ctx-item" onclick="location.reload()">Restart...</div>
        </div>
    </div>

    <div id="menubar">
        <div class="menu-grp">
            <span style="font-weight:700; font-size:16px;"></span>
            <span id="active-app" style="font-weight:600;">Finder</span>
            <span class="menu-item">File</span>
            <span class="menu-item">Edit</span>
            <span class="menu-item">View</span>
            <span class="menu-item">Go</span>
            <span class="menu-item">Window</span>
            <span class="menu-item">Help</span>
        </div>
        <div class="menu-grp">
            <span class="menu-item">🔋 100%</span>
            <span class="menu-item">📶 Wi-Fi</span>
            <span class="menu-item" id="clock">9:41 AM</span>
        </div>
    </div>

    <div id="win-layer"></div>

    <div id="dock-wrap">
        <div id="dock">
            </div>
    </div>

    <script>
        /* --- HYPERION SYSTEM KERNEL --- */
        const Sys = {
            zIndex: 100,
            draggingId: null,
            resizingId: null,
            clipboard: null,
            wallpaperIndex: 0,
            
            init() {
                this.bootSequence();
                this.time.start();
                this.ui.renderIcons();
                this.ui.renderDock();
                this.input.setup();
                
                // Add default files
                this.fs.addFile('Macintosh HD', 'drive');
                this.fs.addFile('Portfolio.pdf', 'pdf');
                this.fs.addFile('Project X', 'folder');
            },

            bootSequence() {
                const bar = document.getElementById('boot-fill');
                const screen = document.getElementById('boot-screen');
                
                // Simulate boot stages
                setTimeout(() => bar.style.width = "30%", 200);
                setTimeout(() => bar.style.width = "70%", 800);
                setTimeout(() => bar.style.width = "100%", 1600);
                
                setTimeout(() => {
                    screen.style.opacity = 0;
                    setTimeout(() => {
                        screen.remove();
                        this.apps.open('safari'); // Auto launch browser
                    }, 1000);
                }, 2200);
            },

            time: {
                start() {
                    const update = () => {
                        const now = new Date();
                        document.getElementById('clock').innerText = now.toLocaleTimeString('en-US', {hour: 'numeric', minute:'2-digit'});
                    };
                    setInterval(update, 1000);
                    update();
                }
            },

            fs: {
                files: [],
                addFile(name, type) {
                    const id = Date.now() + Math.random();
                    this.files.push({ id, name, type });
                    Sys.ui.renderIcons();
                }
            },

            ui: {
                renderIcons() {
                    const grid = document.getElementById('icon-grid');
                    grid.innerHTML = '';
                    const icons = { drive: '💾', folder: '📁', pdf: '📄', img: '🖼️', txt: '📝', unknown: '📦' };
                    
                    Sys.fs.files.forEach(f => {
                        const div = document.createElement('div');
                        div.className = 'd-icon';
                        div.dataset.id = f.id;
                        div.onmousedown = (e) => {
                            e.stopPropagation();
                            if(!e.shiftKey) document.querySelectorAll('.d-icon').forEach(el => el.classList.remove('selected'));
                            div.classList.add('selected');
                        };
                        div.innerHTML = `<div class="d-img">${icons[f.type] || icons.unknown}</div><div class="d-label">${f.name}</div>`;
                        grid.appendChild(div);
                    });
                },

                renderDock() {
                    const dock = document.getElementById('dock');
                    const apps = [
                        { id: 'finder', icon: '😊', name: 'Finder' },
                        { id: 'safari', icon: '🧭', name: 'Safari' },
                        { id: 'terminal', icon: '💻', name: 'Terminal' },
                        { id: 'vscode', icon: '🛠️', name: 'VS Code' },
                        { id: 'calc', icon: '🧮', name: 'Calculator' },
                        { id: 'settings', icon: '⚙️', name: 'Settings' }
                    ];
                    
                    dock.innerHTML = apps.map(app => `
                        <div class="dock-app" id="dock-${app.id}" onclick="Sys.apps.open('${app.id}')" title="${app.name}">
                            ${app.icon}
                            <div class="dock-dot"></div>
                        </div>
                    `).join('');
                }
            },

            input: {
                setup() {
                    const box = document.getElementById('selection-box');
                    let startX, startY, isSel = false;

                    /* --- GLOBAL EVENTS --- */
                    document.addEventListener('contextmenu', e => {
                        e.preventDefault();
                        const menu = document.getElementById('ctx-menu');
                        menu.style.display = 'flex';
                        
                        // Prevent menu from going off-screen
                        let x = e.clientX;
                        let y = e.clientY;
                        if (x + 200 > window.innerWidth) x = window.innerWidth - 200;
                        if (y + menu.offsetHeight > window.innerHeight) y = window.innerHeight - menu.offsetHeight;
                        
                        menu.style.left = x + 'px';
                        menu.style.top = y + 'px';
                    });
                    
                    document.addEventListener('click', () => document.getElementById('ctx-menu').style.display = 'none');

                    /* --- DRAG & DROP FILES FROM COMPUTER --- */
                    const body = document.body;
                    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(ev => {
                        body.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); });
                    });
                    body.addEventListener('drop', (e) => {
                        const files = e.dataTransfer.files;
                        ([...files]).forEach(file => {
                            let type = 'unknown';
                            if(file.type.includes('image')) type = 'img';
                            if(file.type.includes('pdf')) type = 'pdf';
                            if(file.type.includes('text')) type = 'txt';
                            Sys.fs.addFile(file.name, type);
                        });
                    });

                    /* --- SELECTION & WINDOW DRAG --- */
                    document.addEventListener('mousedown', (e) => {
                        if(e.target.id === 'desktop' || e.target.id === 'icon-grid') {
                            document.querySelectorAll('.d-icon').forEach(el => el.classList.remove('selected'));
                            isSel = true;
                            startX = e.clientX; startY = e.clientY;
                            box.style.display = 'block';
                            box.style.width = '0'; box.style.height = '0';
                            box.style.left = startX+'px'; box.style.top = startY+'px';
                        }
                    });

                    document.addEventListener('mousemove', (e) => {
                        // Window Drag
                        if(Sys.draggingId) {
                            const win = document.getElementById(Sys.draggingId);
                            if(win) {
                                let y = e.clientY - win.dataset.offY;
                                if(y < 30) y = 30; // Menu bar block
                                win.style.left = (e.clientX - win.dataset.offX) + 'px';
                                win.style.top = y + 'px';
                            }
                        }
                        // Window Resize
                        if(Sys.resizingId) {
                            const win = document.getElementById(Sys.resizingId);
                            win.style.width = (e.clientX - win.getBoundingClientRect().left) + 'px';
                            win.style.height = (e.clientY - win.getBoundingClientRect().top) + 'px';
                        }
                        // Selection Box
                        if(isSel) {
                            const curX = e.clientX; const curY = e.clientY;
                            const left = Math.min(startX, curX);
                            const top = Math.min(startY, curY);
                            box.style.left = left+'px'; box.style.top = top+'px';
                            box.style.width = Math.abs(curX - startX)+'px';
                            box.style.height = Math.abs(curY - startY)+'px';
                            
                            // Hit Test
                            document.querySelectorAll('.d-icon').forEach(icon => {
                                const r = icon.getBoundingClientRect();
                                if(left < r.right && left+Math.abs(curX-startX) > r.left && 
                                   top < r.bottom && top+Math.abs(curY-startY) > r.top) {
                                    icon.classList.add('selected');
                                } else {
                                    icon.classList.remove('selected');
                                }
                            });
                        }
                    });

                    document.addEventListener('mouseup', () => {
                        isSel = false;
                        Sys.draggingId = null;
                        Sys.resizingId = null;
                        box.style.display = 'none';
                        document.querySelectorAll('iframe').forEach(i => i.style.pointerEvents = 'auto');
                    });
                }
            },

            apps: {
                safariHistory: ['https://nicewang.github.io/niceproject/'],
                safariIndex: 0,
                
                definitions: {
                    'finder': { title:'Finder', w:600, h:400, html: `<div style="padding:20px; text-align:center; color:#888;"><h1>Macintosh HD</h1><p>System is operating normally.</p></div>` },
                    'safari': { title:'Safari', w:800, h:550, html: `<div style="display:flex; flex-direction:column; height:100%;">
                        <div style="padding:8px; background:rgba(0,0,0,0.1); display:flex; gap:8px; align-items:center;">
                            <button onclick="Sys.apps.safariGo(-1, event)" style="background:rgba(255,255,255,0.2); border:none; border-radius:4px; padding:4px 10px; color:inherit; cursor:pointer;">◀</button>
                            <button onclick="Sys.apps.safariGo(1, event)" style="background:rgba(255,255,255,0.2); border:none; border-radius:4px; padding:4px 10px; color:inherit; cursor:pointer;">▶</button>
                            <button onclick="Sys.apps.safariRefresh(event)" style="background:rgba(255,255,255,0.2); border:none; border-radius:4px; padding:4px 10px; color:inherit; cursor:pointer;">↻</button>
                            <input value="https://nicewang.github.io/niceproject/" onkeydown="Sys.apps.navSafari(event)" title="Press Enter to navigate" style="flex:1; border:none; border-radius:5px; padding:4px 10px; text-align:center; background:rgba(255,255,255,0.2); color: inherit;">
                        </div>
                        <iframe src="https://nicewang.github.io/niceproject/" style="flex:1; border:none; background:white;"></iframe>
                    </div>` },
                    'terminal': { title:'Terminal', w:500, h:320, html: `<div class="term-wrap" onclick="this.querySelector('input').focus()">
                        <div>Last login: ${new Date().toDateString()} on ttys000</div>
                        <br>
                        <div id="term-log"></div>
                        <div style="display:flex;">
                            <span style="color:#33ff00; margin-right:8px;">root@hyperion ~ %</span>
                            <input class="term-input" onkeydown="Sys.apps.handleTerm(event)">
                        </div>
                    </div>` },
                    'calc': { title:'Calculator', w:260, h:340, html: `<div class="calc-grid">
                        <div class="calc-display" id="c-res">0</div>
                        ${['AC','+/-','%','÷','7','8','9','×','4','5','6','-','1','2','3','+','0','.','='].map(b => 
                            `<button class="calc-btn ${['÷','×','-','+','='].includes(b)?'c-o':['AC','+/-','%'].includes(b)?'c-g':'c-d'}" 
                            ${b==='0'?'style="grid-column:span 2"':''} onclick="Sys.apps.calc('${b}')">${b}</button>`).join('')}
                    </div>` },
                    'vscode': { title:'Code', w:700, h:500, html: `<div style="background:#1e1e1e; height:100%; padding:15px; color:#ccc; font-family:monospace;">
                        <span style="color:#c586c0">const</span> <span style="color:#dcdcaa">Future</span> = () <span style="color:#569cd6">=></span> {<br>
                        &nbsp;&nbsp;<span style="color:#ce9178">"Hyperion OS is ready."</span><br>
                        }
                    </div>` },
                    'settings': { title:'Settings', w:400, h:300, html: `<div style="padding:20px;">
                        <h3>Appearance</h3>
                        <button onclick="Sys.toggleTheme()" style="padding:8px 16px; border-radius: 6px; border: none; background: var(--accent-color); color: white; cursor: pointer;">Toggle Dark/Light Mode</button>
                        <br><br>
                        <h3>Wallpaper</h3>
                        <button onclick="Sys.changeWallpaper()" style="padding:8px 16px; border-radius: 6px; border: none; background: var(--accent-color); color: white; cursor: pointer;">Next Wallpaper 🌅</button>
                    </div>` }
                },

                open(id) {
                    const app = this.definitions[id];
                    const uid = `win-${Date.now()}`;
                    
                    // Activate Dock
                    const dIcon = document.getElementById(`dock-${id}`);
                    if(dIcon) {
                        dIcon.classList.add('running');
                        dIcon.style.animation = 'bounce 0.5s';
                        setTimeout(() => dIcon.style.animation='', 500);
                    }

                    document.getElementById('active-app').innerText = app.title;

                    const win = document.createElement('div');
                    win.className = 'window open active';
                    win.id = uid;
                    win.style.width = app.w + 'px';
                    win.style.height = app.h + 'px';
                    win.style.zIndex = ++Sys.zIndex;
                    
                    // Center-ish spawn
                    const rX = window.innerWidth / 2 - (app.w / 2) + (Math.random()*40 - 20);
                    const rY = window.innerHeight / 2 - (app.h / 2) + (Math.random()*40 - 20);
                    win.style.top = rY + 'px'; win.style.left = rX + 'px';

                    win.innerHTML = `
                        <div class="title-bar" onmousedown="Sys.apps.drag(event, '${uid}')">
                            <div class="t-lights">
                                <div class="dot cl" onclick="Sys.apps.close('${uid}', '${id}')"></div>
                                <div class="dot mn" onclick="Sys.apps.min('${uid}')"></div>
                                <div class="dot mx" onclick="Sys.apps.max('${uid}')"></div>
                            </div>
                            <div class="t-title">${app.title}</div>
                        </div>
                        <div class="win-body">${app.html}</div>
                        <div class="resize-handle" onmousedown="Sys.apps.resize(event, '${uid}')"></div>
                    `;
                    
                    win.addEventListener('mousedown', () => {
                        win.style.zIndex = ++Sys.zIndex;
                        document.querySelectorAll('.window').forEach(w=>w.classList.remove('active'));
                        win.classList.add('active');
                        document.getElementById('active-app').innerText = app.title;
                    });

                    document.getElementById('win-layer').appendChild(win);
                },

                close(uid, appId) {
                    const win = document.getElementById(uid);
                    win.classList.remove('open');
                    win.style.opacity = 0;
                    win.style.transform = "scale(0.9)";
                    setTimeout(() => win.remove(), 250);
                },

                min(uid) {
                    const win = document.getElementById(uid);
                    win.style.transform = "translateY(100vh) scale(0.1)";
                    win.style.opacity = 0;
                    win.classList.remove('active');
                },

                max(uid) {
                    const win = document.getElementById(uid);
                    if(win.dataset.max) {
                        win.style.top = win.dataset.ot; win.style.left = win.dataset.ol;
                        win.style.width = win.dataset.ow; win.style.height = win.dataset.oh;
                        delete win.dataset.max;
                    } else {
                        win.dataset.ot = win.style.top; win.dataset.ol = win.style.left;
                        win.dataset.ow = win.style.width; win.dataset.oh = win.style.height;
                        win.style.top = '30px'; win.style.left = '0';
                        win.style.width = '100%'; win.style.height = 'calc(100% - 110px)';
                        win.dataset.max = true;
                    }
                },

                drag(e, uid) {
                    if(e.target.closest('.t-lights')) return;
                    const win = document.getElementById(uid);
                    Sys.draggingId = uid;
                    const r = win.getBoundingClientRect();
                    win.dataset.offX = e.clientX - r.left;
                    win.dataset.offY = e.clientY - r.top;
                    document.querySelectorAll('iframe').forEach(i => i.style.pointerEvents = 'none');
                },

                resize(e, uid) {
                    e.stopPropagation();
                    Sys.resizingId = uid;
                    document.querySelectorAll('iframe').forEach(i => i.style.pointerEvents = 'none');
                },
                
                // Utils
                calc(key) {
                    const d = document.getElementById('c-res');
                    if(!d) return;
                    if(key === 'AC') d.innerText = '0';
                    else if(key === '=') { try { d.innerText = eval(d.innerText.replace('×','*').replace('÷','/')) } catch { d.innerText = 'Error'} }
                    else { if(d.innerText === '0') d.innerText = key; else d.innerText += key; }
                },

                navSafari(e) {
                    // 监听回车键，让内置浏览器可以直接跳转
                    if(e.key === 'Enter') {
                        let url = e.target.value;
                        if(!url.startsWith('http')) {
                            url = 'https://' + url;
                        }
                        
                        // 记录历史，用于后退和前进
                        Sys.apps.safariHistory = Sys.apps.safariHistory.slice(0, Sys.apps.safariIndex + 1);
                        Sys.apps.safariHistory.push(url);
                        Sys.apps.safariIndex++;
                        
                        Sys.apps.updateSafariView(e.target.closest('.win-body'));
                    }
                },

                safariGo(dir, e) {
                    let newIndex = Sys.apps.safariIndex + dir;
                    // 如果存在历史记录则允许后退/前进
                    if (newIndex >= 0 && newIndex < Sys.apps.safariHistory.length) {
                        Sys.apps.safariIndex = newIndex;
                        Sys.apps.updateSafariView(e.target.closest('.win-body'));
                    }
                },
                
                safariRefresh(e) {
                    Sys.apps.updateSafariView(e.target.closest('.win-body'));
                },
                
                updateSafariView(winBody) {
                    if(!winBody) return;
                    const url = Sys.apps.safariHistory[Sys.apps.safariIndex];
                    const iframe = winBody.querySelector('iframe');
                    const input = winBody.querySelector('input');
                    if(iframe) iframe.src = url;
                    if(input) input.value = url;
                },

                handleTerm(e) {
                    if(e.key === 'Enter') {
                        const v = e.target.value;
                        const log = document.getElementById('term-log');
                        log.innerHTML += `<div>root@hyperion ~ % ${v}</div>`;
                        let resp = '';
                        if(v === 'help') resp = 'Commands: help, date, clear, open [app]';
                        else if(v === 'date') resp = new Date().toString();
                        else if(v === 'clear') log.innerHTML = '';
                        else if(v.startsWith('open ')) {
                            let appName = v.split(' ')[1];
                            if(Sys.apps.definitions[appName]) Sys.apps.open(appName);
                            else resp = `App not found. Try: finder, safari, terminal, calc, vscode, settings`;
                        }
                        else if(v) resp = `zsh: command not found: ${v}`;
                        
                        if(resp) log.innerHTML += `<div style="opacity:0.8; margin-bottom:5px;">${resp}</div>`;
                        e.target.value = '';
                        e.target.scrollIntoView();
                    }
                }
            },

            toggleTheme() {
                document.body.classList.toggle('dark-mode');
                // 如果当前是默认的 Catalina 壁纸，清除内联样式让 CSS 的日/夜变量生效
                if (this.wallpaperIndex === 0) {
                    document.getElementById('desktop').style.backgroundImage = '';
                }
            },
            
            changeWallpaper() {
                const wallpapers = [
                    '', // 索引0: 留空，自动匹配 Catalina 日/夜间动态壁纸
                    'https://cdn.jsdelivr.net/gh/komeil/macOS-wallpapers@master/macOS%2010.15%20Catalina/Catalina%20Day.jpg', // 纯日间模式备用
                    'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop', // Big Sur 抽象流体
                    'https://images.unsplash.com/photo-1534293230397-c06affcfab4d?q=80&w=2560&auto=format&fit=crop', // 赛博朋克霓虹网格
                    'https://images.unsplash.com/photo-1614729939124-032f0b56c9ce?q=80&w=2560&auto=format&fit=crop'  // 太空星云深空
                ];
                
                // 循环切换
                this.wallpaperIndex = (this.wallpaperIndex + 1) % wallpapers.length;
                
                if (this.wallpaperIndex === 0) {
                    document.getElementById('desktop').style.backgroundImage = '';
                } else {
                    document.getElementById('desktop').style.backgroundImage = `url('${wallpapers[this.wallpaperIndex]}')`;
                }
            },
            
            createFolder() {
                this.fs.addFile('New Folder', 'folder');
            }
        };

        // Add bounce anim
        const s = document.createElement('style');
        s.innerHTML = "@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }";
        document.head.appendChild(s);

        window.onload = () => Sys.init();

    </script>
</body>
</html>
