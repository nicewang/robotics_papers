<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D ISS 实时轨道追踪 | 3D Orbital Tracker</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a; /* slate-900 */
            color: #f8fafc; /* slate-50 */
            margin: 0;
            overflow: hidden;
        }
        
        #scene-container {
            height: 100%;
            width: 100%;
            background-color: #050810;
            z-index: 1;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        /* Loading Overlay for 3D Canvas */
        #loading-overlay {
            position: absolute;
            inset: 0;
            background: #0f172a;
            z-index: 500;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease-out;
        }
        .loader-ring {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(56, 189, 248, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-screen w-screen flex flex-col">

    <!-- 3D Scene Container -->
    <div id="scene-container"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay">
        <div class="loader-ring mb-4"></div>
        <h2 class="text-xl font-mono text-blue-400 tracking-widest uppercase">INITIALIZING 3D ENGINE...</h2>
        <p class="text-sm text-slate-500 mt-2 font-mono" id="loading-text">Loading orbital mechanics</p>
    </div>

    <!-- Header -->
    <header class="glass-panel z-10 px-6 py-4 flex justify-between items-center relative pointer-events-none">
        <div class="flex items-center gap-4 pointer-events-auto">
            <div class="bg-blue-500/20 p-2 rounded-lg border border-blue-500/30">
                <i class="ph ph-planet text-3xl text-blue-400"></i>
            </div>
            <div>
                <h1 class="text-xl md:text-2xl font-bold tracking-wide text-white drop-shadow-md">3D 轨道空间追踪系统</h1>
                <p class="text-xs md:text-sm text-slate-400 font-mono tracking-wider">HIGH-FIDELITY ORBITAL TRACKER</p>
            </div>
        </div>
        
        <div class="hidden md:flex items-center gap-6 pointer-events-auto">
            <div class="text-right flex flex-col items-end">
                <span class="text-xs text-slate-400 uppercase tracking-widest mb-1">遥测连接状态</span>
                <div class="flex items-center gap-2">
                    <span class="relative flex h-3 w-3">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                    </span>
                    <span class="text-sm text-emerald-400 font-mono" id="connection-status">正在连接...</span>
                </div>
            </div>
            <div class="h-8 w-px bg-slate-700"></div>
            <div class="text-right">
                <span class="text-xs text-slate-400 uppercase tracking-widest block mb-1">UTC 时间</span>
                <span class="text-sm font-mono text-slate-200" id="utc-time">--:--:--</span>
            </div>
        </div>
    </header>

    <!-- Main Content Layout Overlay -->
    <main class="flex-1 relative flex flex-col lg:flex-row w-full h-full pointer-events-none">
        
        <!-- Controls Overlay -->
        <div class="absolute top-4 right-4 z-[400] glass-panel p-3 rounded-xl flex items-center gap-3 shadow-xl pointer-events-auto">
            <label class="flex items-center gap-2 cursor-pointer group">
                <div class="relative">
                    <input type="checkbox" id="auto-center" class="sr-only" checked>
                    <div class="block bg-slate-800 w-10 h-6 rounded-full transition border border-slate-600 group-hover:bg-slate-700"></div>
                    <div class="dot absolute left-1 top-1 w-4 h-4 rounded-full transition transform translate-x-4 bg-blue-400 shadow-[0_0_8px_rgba(56,189,248,0.8)]"></div>
                </div>
                <span class="text-sm font-medium text-slate-300 select-none">锁定视角 (Lock Cam)</span>
            </label>
            <button id="recenter-btn" class="p-2 bg-slate-800/80 hover:bg-slate-700 rounded-lg transition border border-slate-600" title="重新居中">
                <i class="ph ph-crosshair text-lg text-blue-400"></i>
            </button>
        </div>

        <!-- Sidebar / Stats -->
        <aside class="w-full lg:w-96 glass-panel z-10 border-r border-slate-700/50 flex flex-col shadow-2xl max-h-[40vh] lg:max-h-full overflow-y-auto pointer-events-auto mt-auto lg:mt-0 lg:absolute lg:left-0 lg:top-0 lg:bottom-0">
            <div class="p-6">
                <h2 class="text-sm font-bold text-slate-300 uppercase tracking-widest mb-6 flex items-center gap-2">
                    <i class="ph ph-radar text-blue-400 animate-pulse"></i> 实时遥测分析
                </h2>
                
                <div class="grid grid-cols-2 lg:grid-cols-1 gap-4">
                    <!-- Metric Card: Velocity -->
                    <div class="bg-slate-800/40 p-4 rounded-xl border border-slate-700/50 hover:bg-slate-800/60 transition relative overflow-hidden">
                        <div class="absolute -right-4 -top-4 text-slate-700/30">
                            <i class="ph-fill ph-gauge text-6xl"></i>
                        </div>
                        <div class="relative z-10">
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-slate-400 text-xs font-medium uppercase tracking-wider">轨道速度</span>
                            </div>
                            <div class="flex items-baseline gap-1">
                                <span class="text-2xl lg:text-3xl font-bold font-mono text-white tracking-tight" id="stat-velocity">-----</span>
                                <span class="text-sm text-slate-400 font-mono">km/h</span>
                            </div>
                        </div>
                    </div>

                    <!-- Metric Card: Altitude -->
                    <div class="bg-slate-800/40 p-4 rounded-xl border border-slate-700/50 hover:bg-slate-800/60 transition relative overflow-hidden">
                        <div class="absolute -right-4 -top-4 text-slate-700/30">
                            <i class="ph-fill ph-arrows-out-line-vertical text-6xl"></i>
                        </div>
                        <div class="relative z-10">
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-slate-400 text-xs font-medium uppercase tracking-wider">当前高度</span>
                            </div>
                            <div class="flex items-baseline gap-1">
                                <span class="text-2xl lg:text-3xl font-bold font-mono text-white tracking-tight" id="stat-altitude">---.-</span>
                                <span class="text-sm text-slate-400 font-mono">km</span>
                            </div>
                        </div>
                    </div>

                    <!-- Metric Card: Coordinates -->
                    <div class="bg-slate-800/40 p-4 rounded-xl border border-slate-700/50 hover:bg-slate-800/60 transition col-span-2 lg:col-span-1">
                        <span class="text-slate-400 text-xs font-medium uppercase tracking-wider block mb-3">星下点坐标 (Sub-satellite Point)</span>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <span class="text-[10px] text-slate-500 uppercase">纬度 LAT</span>
                                <div class="text-lg lg:text-xl font-bold font-mono text-blue-400" id="stat-lat">--.----°</div>
                            </div>
                            <div>
                                <span class="text-[10px] text-slate-500 uppercase">经度 LNG</span>
                                <div class="text-lg lg:text-xl font-bold font-mono text-blue-400" id="stat-lng">---.----°</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Status Info -->
                <div class="mt-6 p-4 rounded-xl border border-slate-700/50 bg-slate-800/30">
                    <div class="flex items-center justify-between">
                        <span class="text-sm text-slate-400">光照状态 (Illumination)</span>
                        <div class="flex items-center gap-2" id="visibility-container">
                            <i class="ph ph-sun text-yellow-400 text-xl" id="vis-icon"></i>
                            <span class="text-sm font-medium text-white" id="stat-visibility">--</span>
                        </div>
                    </div>
                    <!-- Day/Night Cycle description -->
                    <p class="text-xs text-slate-500 mt-3 border-t border-slate-700/50 pt-3">
                        <i class="ph ph-info mr-1"></i>
                        3D 太阳光源已根据当前真实天文星历数据 (Solar Ephemeris) 实时同步。
                    </p>
                </div>
            </div>
        </aside>
    </main>

    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        // --- Globals & State ---
        let scene, camera, renderer, controls;
        let earth, atmosphere, issGroup, sunLight;
        let trajectoryLine;
        const EARTH_RADIUS = 10;
        const TRAJECTORY_MAX_POINTS = 300;
        let pathPositionsArray = [];
        
        let autoCenter = true;
        let currentIssVector = null;
        let isUserDragging = false;

        // --- DOM Elements ---
        const ui = {
            velocity: document.getElementById('stat-velocity'),
            altitude: document.getElementById('stat-altitude'),
            lat: document.getElementById('stat-lat'),
            lng: document.getElementById('stat-lng'),
            visibility: document.getElementById('stat-visibility'),
            visIcon: document.getElementById('vis-icon'),
            status: document.getElementById('connection-status'),
            utcTime: document.getElementById('utc-time'),
            chkAutoCenter: document.getElementById('auto-center'),
            btnRecenter: document.getElementById('recenter-btn'),
            loadingOverlay: document.getElementById('loading-overlay'),
            loadingText: document.getElementById('loading-text')
        };

        // --- Math Helpers ---
        // Converts Latitude, Longitude, and Altitude to 3D Cartesian Vector
        function latLongToVector3(lat, lon, earthRadius, altitudeKm = 0) {
            // ISS altitude is ~400km, Earth radius is ~6371km.
            const scaleFactor = altitudeKm / 6371.0;
            const radius = earthRadius + (earthRadius * scaleFactor);
            
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            
            // Note: ThreeJS coordinate system adjustments
            const x = -(radius * Math.sin(phi) * Math.cos(theta));
            const y = radius * Math.cos(phi);
            const z = radius * Math.sin(phi) * Math.sin(theta);
            
            return new THREE.Vector3(x, y, z);
        }

        // --- 3D Engine Initialization ---
        function init3D() {
            ui.loadingText.innerText = "Configuring rendering engine...";
            const container = document.getElementById('scene-container');
            
            // 1. Scene & Camera
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050810, 0.015);
            
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 15, 35);

            // 2. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // optimize for high DPI
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            container.appendChild(renderer.domElement);

            // 3. Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enablePan = false;
            controls.minDistance = EARTH_RADIUS + 2;
            controls.maxDistance = EARTH_RADIUS * 6;
            
            controls.addEventListener('start', () => { isUserDragging = true; });
            controls.addEventListener('end', () => { isUserDragging = false; });
            // Disable auto-center if user actively interacts
            controls.addEventListener('change', () => {
                if (isUserDragging && autoCenter) {
                    ui.chkAutoCenter.checked = false;
                    ui.chkAutoCenter.dispatchEvent(new Event('change'));
                }
            });

            buildUniverse();
            
            // Handle Resize
            window.addEventListener('resize', onWindowResize, false);
        }

        function buildUniverse() {
            ui.loadingText.innerText = "Constructing procedural Earth & ISS models...";
            
            // --- LIGHTING (Realistic Day/Night Based on Sun) ---
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.05); // Very dim dark side
            scene.add(ambientLight);

            // The main Sun Light (Directional). Its position will be updated via API solar data.
            sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
            sunLight.position.set(100, 0, 0); // Default, updated later
            scene.add(sunLight);
            
            // --- EARTH (High-Fidelity Procedural Shading fallback) ---
            const earthGeo = new THREE.SphereGeometry(EARTH_RADIUS, 128, 128);
            
            // Using a highly polished standard material. Deep ocean blue base.
            const earthMat = new THREE.MeshStandardMaterial({
                color: 0x051a30,
                roughness: 0.6,
                metalness: 0.1,
            });
            earth = new THREE.Mesh(earthGeo, earthMat);
            scene.add(earth);

            // Wireframe Grid Overlay for "Digital/Tracker" feel
            const gridGeo = new THREE.WireframeGeometry(new THREE.SphereGeometry(EARTH_RADIUS * 1.002, 36, 36));
            const gridMat = new THREE.LineBasicMaterial({ color: 0x1e293b, transparent: true, opacity: 0.3 });
            const grid = new THREE.LineSegments(gridGeo, gridMat);
            scene.add(grid);

            // Atmospheric Glow (Outer sphere)
            const atmoGeo = new THREE.SphereGeometry(EARTH_RADIUS * 1.05, 64, 64);
            const atmoMat = new THREE.MeshBasicMaterial({
                color: 0x38bdf8,
                transparent: true,
                opacity: 0.1,
                side: THREE.BackSide,
                blending: THREE.AdditiveBlending
            });
            atmosphere = new THREE.Mesh(atmoGeo, atmoMat);
            scene.add(atmosphere);

            // --- ISS MODEL ---
            issGroup = new THREE.Group();
            
            // Core module
            const coreGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.6, 16);
            const coreMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.8, roughness: 0.2 });
            const core = new THREE.Mesh(coreGeo, coreMat);
            core.rotation.x = Math.PI / 2;
            issGroup.add(core);

            // Solar Panels
            const panelGeo = new THREE.BoxGeometry(1.2, 0.02, 0.4);
            const panelMat = new THREE.MeshStandardMaterial({ color: 0x1d4ed8, metalness: 0.9, roughness: 0.1 });
            
            const panel1 = new THREE.Mesh(panelGeo, panelMat);
            panel1.position.z = 0.3;
            issGroup.add(panel1);
            
            const panel2 = new THREE.Mesh(panelGeo, panelMat);
            panel2.position.z = -0.3;
            issGroup.add(panel2);

            // Add a glowing beacon to ISS
            const beaconLight = new THREE.PointLight(0xff0000, 1, 5);
            issGroup.add(beaconLight);

            scene.add(issGroup);

            // --- TRAJECTORY LINE ---
            const lineGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(TRAJECTORY_MAX_POINTS * 3);
            lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            lineGeo.setDrawRange(0, 0);
            
            const lineMat = new THREE.LineBasicMaterial({ 
                color: 0x38bdf8, 
                linewidth: 2, // Note: WebGL usually restricts linewidth to 1, but we define it anyway
                transparent: true, 
                opacity: 0.8 
            });
            trajectoryLine = new THREE.Line(lineGeo, lineMat);
            scene.add(trajectoryLine);

            // --- STARS BACKGROUND ---
            const starsGeo = new THREE.BufferGeometry();
            const starsPositions = [];
            for (let i = 0; i < 2000; i++) {
                // Distribute stars far away
                const r = 200 + Math.random() * 300;
                const theta = 2 * Math.PI * Math.random();
                const phi = Math.acos(2 * Math.random() - 1);
                
                const x = r * Math.sin(phi) * Math.cos(theta);
                const y = r * Math.sin(phi) * Math.sin(theta);
                const z = r * Math.cos(phi);
                starsPositions.push(x, y, z);
            }
            starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(starsPositions, 3));
            const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, transparent: true, opacity: 0.8 });
            const stars = new THREE.Points(starsGeo, starsMat);
            scene.add(stars);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Data Fetching & Sync ---
        async function fetchISSData() {
            try {
                const response = await fetch('https://api.wheretheiss.at/v1/satellites/25544');
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                
                ui.status.textContent = "遥测正常";
                ui.status.className = 'text-sm text-emerald-400 font-mono';
                ui.status.previousElementSibling.children[0].className = 'animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75';
                ui.status.previousElementSibling.children[1].className = 'relative inline-flex rounded-full h-3 w-3 bg-emerald-500';

                updateDashboard(data);
                
            } catch (error) {
                console.error("Error fetching ISS data:", error);
                ui.status.textContent = "连接断开";
                ui.status.className = 'text-sm text-red-400 font-mono';
                ui.status.previousElementSibling.children[0].className = 'animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75';
                ui.status.previousElementSibling.children[1].className = 'relative inline-flex rounded-full h-3 w-3 bg-red-500';
            }
        }

        function updateDashboard(data) {
            const { latitude, longitude, altitude, velocity, visibility, solar_lat, solar_lon } = data;

            // 1. Update HTML Stats
            ui.velocity.textContent = Math.round(velocity).toLocaleString();
            ui.altitude.textContent = altitude.toFixed(1);
            
            ui.lat.textContent = (latitude >= 0 ? '+' : '') + latitude.toFixed(4) + '°';
            ui.lng.textContent = (longitude >= 0 ? '+' : '') + longitude.toFixed(4) + '°';

            if (visibility === 'daylight') {
                ui.visibility.textContent = '日光照射区 (Daylight)';
                ui.visibility.className = 'text-sm font-medium text-yellow-400';
                ui.visIcon.className = 'ph ph-sun text-yellow-400 text-xl';
            } else {
                ui.visibility.textContent = '地球阴影区 (Eclipsed)';
                ui.visibility.className = 'text-sm font-medium text-indigo-400';
                ui.visIcon.className = 'ph ph-moon-stars text-indigo-400 text-xl';
            }

            // 2. Update 3D Positions
            
            // Calculate Sun Position and update directional light to create realistic terminator line!
            const sunVector = latLongToVector3(solar_lat, solar_lon, EARTH_RADIUS, 149597870); // Approx distance
            sunLight.position.copy(sunVector).normalize().multiplyScalar(100);

            // Calculate ISS Position
            currentIssVector = latLongToVector3(latitude, longitude, EARTH_RADIUS, altitude);
            
            // Make ISS point vaguely along its orbital path
            if (pathPositionsArray.length > 0) {
                const prev = pathPositionsArray[pathPositionsArray.length - 1];
                issGroup.position.copy(currentIssVector);
                issGroup.lookAt(currentIssVector.clone().add(currentIssVector.clone().sub(prev)));
            } else {
                issGroup.position.copy(currentIssVector);
                issGroup.lookAt(0,0,0);
            }

            // 3. Update Trajectory Buffer
            pathPositionsArray.push(currentIssVector.clone());
            if (pathPositionsArray.length > TRAJECTORY_MAX_POINTS) {
                pathPositionsArray.shift(); // keep it manageable
            }
            
            const positionsArray = trajectoryLine.geometry.attributes.position.array;
            for (let i = 0; i < pathPositionsArray.length; i++) {
                positionsArray[i * 3] = pathPositionsArray[i].x;
                positionsArray[i * 3 + 1] = pathPositionsArray[i].y;
                positionsArray[i * 3 + 2] = pathPositionsArray[i].z;
            }
            trajectoryLine.geometry.attributes.position.needsUpdate = true;
            trajectoryLine.geometry.setDrawRange(0, pathPositionsArray.length);

            // Hide Loading Overlay on first valid data
            if (ui.loadingOverlay.style.opacity !== '0') {
                ui.loadingOverlay.style.opacity = '0';
                setTimeout(() => ui.loadingOverlay.style.display = 'none', 800);
            }
        }

        function updateClock() {
            const now = new Date();
            ui.utcTime.textContent = now.toISOString().substring(11, 19) + ' Z';
        }

        // --- Render Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            
            // Camera Auto-Center Logic
            if (autoCenter && currentIssVector) {
                // Calculate ideal camera position (slightly above and looking down at ISS)
                const idealCamPos = currentIssVector.clone().normalize().multiplyScalar(EARTH_RADIUS * 2.2);
                
                // Smoothly lerp camera to ideal position
                camera.position.lerp(idealCamPos, 0.03);
                
                // Always look at Earth's center while tracking
                camera.lookAt(new THREE.Vector3(0,0,0));
            }
            
            renderer.render(scene, camera);
        }

        // --- UI Interactions ---
        ui.chkAutoCenter.addEventListener('change', (e) => {
            autoCenter = e.target.checked;
            const dot = e.target.nextElementSibling.nextElementSibling;
            if (autoCenter) {
                dot.classList.add('translate-x-4', 'bg-blue-400', 'shadow-[0_0_8px_rgba(56,189,248,0.8)]');
                dot.classList.remove('bg-slate-400', 'shadow-none');
            } else {
                dot.classList.remove('translate-x-4', 'bg-blue-400', 'shadow-[0_0_8px_rgba(56,189,248,0.8)]');
                dot.classList.add('bg-slate-400', 'shadow-none');
            }
        });

        ui.btnRecenter.addEventListener('click', () => {
            if (currentIssVector) {
                autoCenter = true;
                ui.chkAutoCenter.checked = true;
                ui.chkAutoCenter.dispatchEvent(new Event('change'));
            }
        });

        // --- Boot Sequence ---
        window.onload = function() {
            // Initialize ThreeJS setup
            init3D();
            
            // Start Animation Loop immediately upon window load
            animate();
            
            // Start Data Fetches
            updateClock();
            fetchISSData(); // Initial fetch
            
            // Setup Intervals
            setInterval(updateClock, 1000); 
            setInterval(fetchISSData, 3000); 
        };
    </script>
</body>
</html>
